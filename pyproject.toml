[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceservices"
version = "0.1.0"
description = "Cisco XML phone applications and a unified communications portal"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
voiceservices = "voiceservices.__main__:main"

[tool.setuptools.package-data]
voiceservices = ["static/*.css"]
