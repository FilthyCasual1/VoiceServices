[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceservices"
dynamic = ["version"]
description = "ServiceReady modular network service setup portal"
requires-python = ">=3.10"
dependencies = ["pyotp==2.9.0", "segno==1.6.6"]

[project.scripts]
voiceservices = "voiceservices.__main__:main"

[tool.setuptools.package-data]
voiceservices = ["addon_catalog.json", "static/*.css", "static/*.png", "static/*.svg"]

[tool.setuptools.dynamic]
version = {attr = "voiceservices.version.__version__"}

[tool.setuptools.packages.find]
include = ["voiceservices*"]
namespaces = false

[project.optional-dependencies]
smtp = ["aiosmtpd==1.4.6"]
