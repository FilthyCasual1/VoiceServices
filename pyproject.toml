[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceservices"
dynamic = ["version"]
description = "Cisco XML phone applications and a unified communications portal"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
voiceservices = "voiceservices.__main__:main"

[tool.setuptools.package-data]
voiceservices = ["static/*.css", "static/*.png", "static/*.svg"]

[tool.setuptools.dynamic]
version = {attr = "voiceservices.version.__version__"}
