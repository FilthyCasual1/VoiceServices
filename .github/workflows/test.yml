name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pyftpdlib==2.1.0 pyotp==2.9.0 segno==1.6.6 aiosmtpd==1.4.6
      - run: python tools/build_addons.py
      - name: Run tests with failure annotations
        run: |
          python - <<'PYTHON'
          import sys, unittest
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          for test,details in result.failures+result.errors:
              text=details.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title='+str(test)+'::'+text)
          sys.exit(not result.wasSuccessful())
          PYTHON
      - run: python -m pip wheel --no-deps --wheel-dir dist/core .
      - uses: actions/upload-artifact@v4
        with:
          name: ServiceReady-python-${{ matrix.python }}
          path: |
            dist/
            packages/addons/
